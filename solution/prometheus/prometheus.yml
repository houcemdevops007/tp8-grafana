# ---------------------------------------------------------------------------
# TP8 — prometheus.yml (SOLUTION complète et commentée) — réservé au formateur
# ---------------------------------------------------------------------------

global:
  # TODO 1 — 15 s : on voit une panne en quelques points de courbe sans
  # saturer le disque. En production : 30 s à 60 s pour des milliers de cibles.
  scrape_interval: 15s

  # TODO 2 — même valeur que scrape_interval : évaluer les règles plus vite
  # que l'arrivée des données ne sert à rien, plus lentement retarde l'alerte.
  evaluation_interval: 15s

  # Au-delà, le scrape est abandonné. Doit rester < scrape_interval.
  scrape_timeout: 10s

  # TODO 3 — collé à toutes les séries qui SORTENT de ce Prometheus
  # (fédération, remote_write, alertes). C'est l'équivalent du tenant
  # cand-XX de Mimir dans les TP1 à TP7.
  external_labels:
    candidate: cand-XX
    stack: tp8

# TODO 7 — les motifs glob sont acceptés : /etc/prometheus/rules/*.yml
rule_files:
  - /etc/prometheus/rules/recording.yml
  - /etc/prometheus/rules/alerts.yml

# TODO 8 — Prometheus POUSSE ses alertes vers l'Alertmanager. C'est le seul
# endroit du modèle pull où Prometheus pousse quelque chose.
alerting:
  alertmanagers:
    - static_configs:
        - targets: ['alertmanager:9093']

scrape_configs:

  - job_name: prometheus
    static_configs:
      - targets: ['localhost:9090']
        labels:
          service: prometheus

  # TODO 4 — « node-exporter » est le nom du service dans docker-compose.yml.
  # Le DNS interne de Docker le résout en l'IP du conteneur : aucune IP en dur.
  - job_name: node
    static_configs:
      - targets: ['node-exporter:9100']
        labels:
          service: systeme

  # TODO 5
  - job_name: apache
    static_configs:
      - targets: ['apache-exporter:9117']
        labels:
          service: web

  # TODO 6 — honor_labels: true est INDISPENSABLE ici.
  # Par défaut, Prometheus écrase les labels « job » et « instance » d'une
  # cible par ceux du scrape. Les métriques de la Pushgateway portent déjà le
  # job et l'instance du script qui les a poussées : sans honor_labels, tout
  # apparaîtrait comme job="pushgateway", instance="pushgateway:9091".
  - job_name: pushgateway
    honor_labels: true
    static_configs:
      - targets: ['pushgateway:9091']

  # ---- Profil « traces » (étape 10) --------------------------------------
  # À DÉCOMMENTER seulement quand le profil traces tourne. Sinon ces deux
  # cibles sont DOWN en permanence et InstanceDown se déclenche pour rien —
  # un bon exemple d'alerte qui crie au loup.
