# ---------------------------------------------------------------------------
# TP8 — Fragment de configuration Apache
#
# Chargé par la commande du conteneur :
#     httpd-foreground -c "Include conf/extra/tp8.conf"
# Le httpd.conf par défaut de l'image officielle n'est pas modifié : tout ce
# qui est propre au TP tient dans ce seul fichier.
# ---------------------------------------------------------------------------

ServerName tp8-apache

# --- mod_status -------------------------------------------------------------
# mod_status est déjà chargé par l'image officielle (LoadModule status_module).
# ExtendedStatus ajoute les compteurs cumulés (accès, octets, CPU) dont
# apache_exporter a besoin : sans lui, apache_accesses_total n'existe pas.
ExtendedStatus On

<Location "/server-status">
    SetHandler server-status
    # Salle de formation : la page est ouverte pour que tu puisses l'afficher
    # depuis ton navigateur. En production on la restreint à l'exporter
    # (« Require local » comme au TP2), car elle révèle les URL visitées.
    Require all granted
</Location>

# --- Pages de test utilisées par scripts/load.sh ----------------------------
Redirect 500 /tp/erreur
Redirect 404 /tp/absent

# --- Journalisation ---------------------------------------------------------
# Format combiné + durée de la requête en microsecondes (%D), utile pour
# comparer ce que disent les logs et ce que dit mod_status.
LogFormat "%h %l %u %t \"%r\" %>s %b \"%{Referer}i\" \"%{User-Agent}i\" %D" tp8
CustomLog /proc/self/fd/1 tp8

# --- Profil « traces » : reverse proxy devant l'application Java ------------
# Ces modules ne sont pas chargés par défaut dans l'image officielle.
# Apache démarre même si le conteneur « app » n'existe pas (profil traces
# arrêté) : la résolution du nom n'a lieu qu'à la première requête sur /app/.
LoadModule proxy_module modules/mod_proxy.so
LoadModule proxy_http_module modules/mod_proxy_http.so

ProxyPreserveHost On
ProxyPass        /app/ http://app:8080/ retry=0 timeout=30
ProxyPassReverse /app/ http://app:8080/
