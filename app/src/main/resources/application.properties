# TP8 — Configuration de la mini-application.
# Toutes les valeurs viennent de l'environnement : voir docker-compose.yml.

server.port=8080
spring.application.name=boutique-java

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/boutique}
spring.datasource.username=${DB_USER:boutique}
spring.datasource.password=${DB_PASSWORD:boutique}
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.connection-timeout=5000

# Journal compact : les logs du conteneur restent lisibles pendant le TP.
logging.level.root=INFO
logging.pattern.console=%d{HH:mm:ss} %-5level %logger{20} - %msg%n
